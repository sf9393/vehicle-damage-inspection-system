name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: env -u GITHUB_ACTIONS -u GITHUB_PAGES npm run build
        env:
          VITE_INFERENCE_API_URL: ${{ vars.INFERENCE_API_URL }}
          NEXT_PUBLIC_SITE_URL: https://sf9393.github.io/vehicle-damage-inspection-system
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
